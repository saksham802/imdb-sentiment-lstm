<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="320" fill="#ffffff" rx="8"/>
  <text x="310" y="22" text-anchor="middle" font-size="16" font-weight="600" fill="#24292f">Training Loss per Epoch</text>

  <!-- grid lines (loss 0.3 .. 0.7) -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="60" y1="50"  x2="560" y2="50"/>
    <line x1="60" y1="90"  x2="560" y2="90"/>
    <line x1="60" y1="130" x2="560" y2="130"/>
    <line x1="60" y1="170" x2="560" y2="170"/>
    <line x1="60" y1="210" x2="560" y2="210"/>
  </g>
  <g font-size="12" fill="#57606a" text-anchor="end">
    <text x="52" y="54">0.7</text>
    <text x="52" y="94">0.6</text>
    <text x="52" y="134">0.5</text>
    <text x="52" y="174">0.4</text>
    <text x="52" y="214">0.3</text>
  </g>

  <!-- axes -->
  <line x1="60" y1="250" x2="560" y2="250" stroke="#57606a" stroke-width="1.5"/>
  <line x1="60" y1="30"  x2="60"  y2="250" stroke="#57606a" stroke-width="1.5"/>

  <!-- x labels -->
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="80"  y="268">1</text>
    <text x="195" y="268">2</text>
    <text x="310" y="268">3</text>
    <text x="425" y="268">4</text>
    <text x="540" y="268">5</text>
    <text x="310" y="292" font-size="13" fill="#24292f">Epoch</text>
  </g>
  <text x="18" y="140" font-size="13" fill="#24292f" text-anchor="middle" transform="rotate(-90 18 140)">Cross-Entropy Loss</text>

  <!-- loss curve -->
  <polyline fill="none" stroke="#2f81f7" stroke-width="3" stroke-linejoin="round"
            points="80,52.3 195,57.5 310,94.3 425,161.9 540,218.2"/>
  <g fill="#2f81f7" stroke="#ffffff" stroke-width="2">
    <circle cx="80"  cy="52.3"  r="5"/>
    <circle cx="195" cy="57.5"  r="5"/>
    <circle cx="310" cy="94.3"  r="5"/>
    <circle cx="425" cy="161.9" r="5"/>
    <circle cx="540" cy="218.2" r="5"/>
  </g>
  <g font-size="11" fill="#24292f" text-anchor="middle">
    <text x="80"  y="42">0.694</text>
    <text x="195" y="47">0.681</text>
    <text x="322" y="84">0.589</text>
    <text x="437" y="152">0.420</text>
    <text x="540" y="238">0.280</text>
  </g>
</svg>
